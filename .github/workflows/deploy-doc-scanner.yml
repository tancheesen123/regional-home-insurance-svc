name: Deploy doc-scanner-svc to Azure

on:
  push:
    branches: [main]
    paths:
      - 'services/doc-scanner-svc/**'
      - '.github/workflows/deploy-doc-scanner.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: rhi-doc-scanner
  IMAGE_NAME: ghcr.io/${{ github.repository }}-doc-scanner

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/doc-scanner-svc
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_DOCSCANNER_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}
